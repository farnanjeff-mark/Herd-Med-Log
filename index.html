<style>
  :root{
    --paper:#EFE8D8;
    --ink:#2B2620;
    --barn:#7A2E27;
    --pasture:#455B3D;
    --tag:#E3A93C;
    --line:#c9bfa4;
    --paper-raised:#F7F2E6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Georgia','Iowan Old Style',serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);}

  .header{padding:22px 18px 16px;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-start;}
  .eyebrow{font-family:'Courier New',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--barn);margin:0 0 4px;}
  .h1{font-family:Georgia,serif;font-weight:700;font-size:26px;margin:0;letter-spacing:.01em;}
  .h1 span{color:var(--pasture);}
  .sync-dot{width:9px;height:9px;border-radius:50%;background:var(--pasture);flex-shrink:0;}
  .sync-dot.err{background:var(--barn);}
  .sync-dot.busy{background:var(--tag);}
  .refresh-btn{
    display:flex;align-items:center;gap:7px;
    font-family:'Courier New',monospace;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    background:var(--paper-raised);border:2px solid var(--ink);border-radius:4px;
    padding:8px 12px;cursor:pointer;color:var(--ink);margin-top:4px;
  }
  .refresh-btn:active{transform:translateY(1px);}

  .view{padding:16px 18px 100px;}
  .hidden{display:none !important;}

  .toolbar{display:flex;gap:8px;margin-bottom:14px;}
  input, select, textarea{
    font-family:'Courier New',monospace;
    background:var(--paper-raised);
    border:2px solid var(--ink);
    color:var(--ink);
    padding:10px 12px;
    font-size:16px;
    border-radius:2px;
    width:100%;
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--pasture);outline-offset:1px;}
  #searchBox{background:#ffffff;}

  .btn{
    font-family:'Courier New',monospace;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    font-size:13px;border:2px solid var(--ink);background:var(--tag);color:var(--ink);
    padding:10px 16px;border-radius:2px;cursor:pointer;white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn[disabled]{opacity:.5;cursor:default;}
  .btn-outline{background:transparent;}
  .btn-barn{background:var(--barn);color:var(--paper);border-color:var(--barn);}
  .btn-pasture{background:var(--pasture);color:var(--paper);border-color:var(--pasture);}
  .btn-full{width:100%;}
  .btn-sm{padding:7px 12px;font-size:13px;}

  .cow-card{
    display:flex;justify-content:space-between;align-items:center;padding:14px 14px;margin-bottom:10px;
    background:var(--paper-raised);border:2px solid var(--ink);border-left:8px solid var(--tag);
    border-radius:2px;cursor:pointer;
  }
  .cow-card.recent-med{border-left-color:var(--barn);}
  .cow-card.recent-note{border-left-color:#3B6E8F;}
  .cow-num{font-size:22px;font-weight:700;font-family:Georgia,serif;}
  .cow-meta{font-family:'Courier New',monospace;font-size:13px;color:#6b6350;margin-top:2px;}
  .chev{font-size:20px;color:var(--ink);opacity:.4;}

  .empty{text-align:center;padding:50px 20px;color:#8a8163;font-family:'Courier New',monospace;font-size:15px;line-height:1.6;}
  .banner{
    font-family:'Courier New',monospace;font-size:12px;background:#f4d9d5;border:2px solid var(--barn);
    color:var(--barn);padding:10px 12px;border-radius:2px;margin-bottom:14px;line-height:1.5;
  }
  .banner-note{background:#fbeecb;border-color:var(--tag);color:#6b4e12;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .banner-note .banner-actions{display:flex;gap:8px;flex-shrink:0;}
  .banner-note button{
    font-family:'Courier New',monospace;font-size:11px;font-weight:700;text-transform:uppercase;
    border:1.5px solid #6b4e12;background:transparent;color:#6b4e12;padding:5px 9px;border-radius:2px;cursor:pointer;
  }

  .stats-row{display:flex;gap:10px;margin-bottom:14px;}
  .stat-chip{flex:1;background:var(--paper-raised);border:2px solid var(--ink);border-radius:2px;padding:10px 8px;text-align:center;}
  .stat-num{font-size:22px;font-weight:700;font-family:Georgia,serif;}
  .stat-label{font-family:'Courier New',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6b6350;margin-top:2px;line-height:1.3;}

  .lot-badge{display:inline-block;background:var(--pasture);color:var(--paper);font-size:11px;font-family:'Courier New',monospace;text-transform:uppercase;letter-spacing:.04em;padding:2px 6px;border-radius:8px;margin-left:6px;}

  .back{
    display:flex;align-items:center;gap:8px;font-family:'Courier New',monospace;font-size:13px;
    letter-spacing:.05em;color:var(--paper);text-transform:uppercase;font-weight:700;
    background:var(--barn);border:2px solid var(--ink);border-radius:2px;
    padding:12px 14px;cursor:pointer;width:100%;margin-bottom:16px;
  }
  .back:active{transform:translateY(1px);}
  .detail-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink);padding-bottom:14px;margin-bottom:16px;}
  .detail-num{font-size:34px;font-weight:700;font-family:Georgia,serif;line-height:1;}
  .detail-sub{font-family:'Courier New',monospace;font-size:13px;color:#6b6350;margin-top:4px;}

  .section-label{
    font-family:'Courier New',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--pasture);font-weight:700;margin:20px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;
  }

  .record{background:var(--paper-raised);border:1.5px solid var(--line);border-left:6px solid var(--line);border-radius:2px;padding:12px 14px;margin-bottom:8px;position:relative;}
  .record.note-entry{border-left-color:#3B6E8F;}
  .record.note-entry .record-date{color:#3B6E8F;}
  .record-date{font-family:'Courier New',monospace;font-size:14px;font-weight:700;color:var(--barn);}
  .record-med{font-size:19px;font-weight:700;margin:3px 0 2px;}
  .record-reason{font-size:16px;color:#4a4433;}
  .record-notes{font-family:'Courier New',monospace;font-size:14px;color:#6b6350;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;}
  .record-del{position:absolute;top:10px;right:10px;background:none;border:none;color:#a08f6b;font-size:16px;cursor:pointer;padding:4px;}
  .record-edit{position:absolute;top:10px;right:34px;background:none;border:none;color:#a08f6b;font-size:14px;cursor:pointer;padding:4px;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-family:'Courier New',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6350;margin-bottom:5px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}

  .fab{
    position:fixed;bottom:24px;left:50%;transform:translateX(calc(-50% + (min(480px,100vw) - 40px)/2 - 26px));
    width:56px;height:56px;border-radius:50%;background:var(--barn);color:var(--paper);border:none;
    font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;
  }
  .fab:active{transform:translateX(calc(-50% + (min(480px,100vw) - 40px)/2 - 26px)) scale(.95);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(43,38,32,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--paper);width:100%;max-width:480px;border-top:3px solid var(--ink);border-radius:12px 12px 0 0;padding:20px 18px 28px;max-height:88vh;overflow-y:auto;}
  .modal-title{font-size:22px;font-weight:700;margin:0 0 16px;font-family:Georgia,serif;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}

  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    padding:10px 18px;border-radius:20px;font-family:'Courier New',monospace;font-size:12px;
    z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:85%;text-align:center;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div>
      <p class="eyebrow">Herd Health Ledger</p>
      <h1 class="h1">Med <span>Log</span></h1>
    </div>
    <button class="refresh-btn" id="refreshBtn"><span id="refreshDot" class="sync-dot"></span> Refresh</button>
  </div>

  <div class="view" id="homeView">
    <div style="text-align:center;padding:40px 10px;">
      <p class="eyebrow">Herd Health Ledger</p>
      <h1 class="h1" style="margin-bottom:30px;">Welcome</h1>
      <button class="btn btn-pasture btn-full" id="homeMedsBtn" style="padding:18px;font-size:16px;">🐄 Meds &amp; Notes</button>
    </div>
  </div>

  <div class="view hidden" id="listView">
    <button class="btn btn-outline btn-full" id="listHomeBtn" style="margin-bottom:14px;">🏠 Home</button>
    <div id="connBanner" class="banner hidden"></div>
    <div id="backupBanner" class="banner banner-note hidden">
      <span id="backupBannerText"></span>
      <span class="banner-actions">
        <button id="backupExportBtn">Export Now</button>
        <button id="backupDismissBtn">Dismiss</button>
      </span>
    </div>
    <div class="stats-row" id="statsRow"></div>
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Search cow #, medicine, reason..." autocomplete="off"/>
      <button class="btn btn-outline btn-sm" id="exportBtn" style="flex-shrink:0;">Export</button>
    </div>
    <div class="toolbar" id="lotFilterRow" style="display:none;">
      <select id="lotFilter"><option value="">All Lots / Groups</option></select>
    </div>
    <div class="toolbar">
      <select id="sortBy" style="flex:1;">
        <option value="number">Sort: Cow Number</option>
        <option value="recent">Sort: Most Recent Entry</option>
      </select>
    </div>
    <div id="cowList"></div>
    <div id="emptyState" class="empty hidden">No cattle logged yet.<br/>Tap the + button to add your first cow.</div>
  </div>

  <div class="view hidden" id="detailView">
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="btn btn-outline" id="detailHomeBtn" style="flex:1;">🏠 Home</button>
      <button class="back" id="backBtn" style="margin-bottom:0;flex:1;">&larr; All Cattle</button>
    </div>
    <div class="detail-head">
      <div>
        <div class="detail-num" id="detailNum">#000</div>
        <div class="detail-sub" id="detailSub">0 treatments logged</div>
      </div>
      <button class="btn btn-outline btn-sm" id="deleteCowBtn">Remove Cow</button>
    </div>

    <button class="btn btn-outline btn-full" id="detailLot" style="margin-bottom:12px;">Set lot/pasture</button>

    <button class="btn btn-pasture btn-full" id="addRecordBtn">+ Log Medicine Given</button>

    <div class="section-label">Treatment History</div>
    <div id="recordList"></div>
    <div id="noRecords" class="empty hidden">No treatments logged for this cow yet.</div>
  </div>

  <button class="fab hidden" id="fabAdd" title="Add cow">+</button>
</div>


<div id="toast" class="toast"></div>

<script>
(function(){
  // ---- Supabase connection ----
  const SUPABASE_URL = 'https://nuutfigyhjyqhtxotuln.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_jvBVaIs5ZYmOUuE8o28mqQ_RMipD5Xw';
  const REST = SUPABASE_URL + '/rest/v1';
  const HEADERS = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };

  let cows = [];        // [{number, added_at}]
  let treatments = [];  // [{id, cow_number, date, medicine, reason, notes}]
  let currentCow = null;

  const homeView = document.getElementById('homeView');
  const listView = document.getElementById('listView');
  const detailView = document.getElementById('detailView');
  const fabAdd = document.getElementById('fabAdd');
  const cowListEl = document.getElementById('cowList');
  const emptyState = document.getElementById('emptyState');
  const searchBox = document.getElementById('searchBox');
  const toastEl = document.getElementById('toast');
  const syncDot = document.getElementById('refreshDot');
  const connBanner = document.getElementById('connBanner');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 1800);
  }

  function setSync(state){ // 'ok' | 'busy' | 'err'
    syncDot.className = 'sync-dot' + (state==='err' ? ' err' : state==='busy' ? ' busy' : '');
  }

  function showConnError(msg){
    connBanner.textContent = msg;
    connBanner.classList.remove('hidden');
  }
  function clearConnError(){
    connBanner.classList.add('hidden');
  }

  async function api(path, options){
    setSync('busy');
    try{
      const res = await fetch(REST + path, Object.assign({ headers: HEADERS }, options||{}));
      if(!res.ok){
        const errText = await res.text().catch(()=> '');
        throw new Error('Supabase error ' + res.status + ': ' + errText);
      }
      setSync('ok');
      clearConnError();
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }catch(e){
      console.error(e);
      setSync('err');
      showConnError('Could not reach the database. Check your internet connection — your last change may not have saved.');
      throw e;
    }
  }

  async function loadAll(){
    try{
      const [cowsRes, treatRes] = await Promise.all([
        api('/cows?select=*&order=number.asc', { method:'GET' }),
        api('/treatments?select=*', { method:'GET' })
      ]);
      cows = cowsRes || [];
      treatments = treatRes || [];
    }catch(e){
      cows = []; treatments = [];
    }
    renderList();
    checkBackupReminder();
  }

  function fmtDate(iso){
    const d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }
  function daysAgo(iso){
    const d = new Date(iso+'T00:00:00');
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.round((now-d)/86400000);
  }
  function addDays(iso, days){
    const d = new Date(iso+'T00:00:00');
    d.setDate(d.getDate() + Number(days));
    return d;
  }
  function todayDate(){
    const d = new Date(); d.setHours(0,0,0,0); return d;
  }
  function escapeHtml(s){
    const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML;
  }
  function recordsFor(num){
    return treatments.filter(t=>t.cow_number===num);
  }

  function cowRecentMedInfo(num){
    const meds = recordsFor(num).filter(r=>r.medicine);
    let recentlyTreated = false;
    meds.forEach(m=>{
      if(daysAgo(m.date) <= 21) recentlyTreated = true;
    });
    return { recentlyTreated };
  }

  function populateLotFilter(){
    const lotFilterRow = document.getElementById('lotFilterRow');
    const lotFilter = document.getElementById('lotFilter');
    const usedLots = [...new Set(cows.map(c=>c.lot).filter(Boolean))];
    const extraLots = usedLots.filter(l=>!LOT_OPTIONS.includes(l)).sort();
    const lots = [...LOT_OPTIONS, ...extraLots];
    lotFilterRow.style.display = '';
    const prevValue = lotFilter.value;
    lotFilter.innerHTML = '<option value="">All Lots / Groups</option>' +
      lots.map(l=>`<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');
    if(lots.includes(prevValue)) lotFilter.value = prevValue;
  }

  function renderStats(){
    const statsRow = document.getElementById('statsRow');
    const now = new Date();
    const treatmentsThisMonth = treatments.filter(t=>{
      if(!t.medicine) return false;
      const d = new Date(t.date+'T00:00:00');
      return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
    }).length;
    statsRow.innerHTML = `
      <div class="stat-chip"><div class="stat-num">${treatmentsThisMonth}</div><div class="stat-label">Treated This Month</div></div>
      <div class="stat-chip"><div class="stat-num">${cows.length}</div><div class="stat-label">Total Cattle</div></div>
    `;
  }


  function latestRecordFor(num){
    const records = recordsFor(num);
    if(records.length === 0) return null;
    return [...records].sort((a,b)=>{
      const dateCmp = b.date.localeCompare(a.date);
      if(dateCmp !== 0) return dateCmp;
      return new Date(b.created_at) - new Date(a.created_at); // same-day tiebreaker
    })[0];
  }

  function renderList(){
    populateLotFilter();
    renderStats();
    const q = (searchBox.value||'').trim().toLowerCase();
    const lotFilterVal = document.getElementById('lotFilter').value;
    const sortMode = document.getElementById('sortBy').value;

    let sorted;
    if(sortMode === 'recent'){
      sorted = [...cows].sort((a,b)=>{
        const la = latestRecordFor(a.number);
        const lb = latestRecordFor(b.number);
        if(!la && !lb) return a.number.localeCompare(b.number, undefined, {numeric:true});
        if(!la) return 1;
        if(!lb) return -1;
        const dateCmp = lb.date.localeCompare(la.date);
        if(dateCmp !== 0) return dateCmp;
        return new Date(lb.created_at) - new Date(la.created_at);
      });
    } else {
      sorted = [...cows].sort((a,b)=> a.number.localeCompare(b.number, undefined, {numeric:true}));
    }

    const filtered = sorted.filter(c=>{
      if(lotFilterVal && c.lot !== lotFilterVal) return false;
      if(!q) return true;
      if(c.number.toLowerCase().includes(q)) return true;
      return recordsFor(c.number).some(r=>
        (r.medicine||'').toLowerCase().includes(q) ||
        (r.reason||'').toLowerCase().includes(q) ||
        (r.notes||'').toLowerCase().includes(q)
      );
    });

    cowListEl.innerHTML = '';
    emptyState.classList.toggle('hidden', cows.length !== 0);

    filtered.forEach(cow=>{
      const num = cow.number;
      const records = recordsFor(num);
      const meds = records.filter(r=>r.medicine);
      const notesOnly = records.filter(r=>!r.medicine);
      let meta;
      if(meds.length === 0 && notesOnly.length === 0){
        meta = 'No entries logged';
      } else {
        const parts = [];
        if(meds.length>0) parts.push(`${meds.length} treatment${meds.length>1?'s':''}`);
        if(notesOnly.length>0) parts.push(`${notesOnly.length} note${notesOnly.length>1?'s':''}`);
        meta = parts.join(' · ');
      }
      const recentInfo = cowRecentMedInfo(num);
      let recentClass = '';
      if(meds.length>0){
        const last = [...meds].sort((a,b)=>b.date.localeCompare(a.date))[0];
        const ago = daysAgo(last.date);
        meta += ` · last med ${ago===0?'today':ago===1?'1 day ago':ago+' days ago'}`;
        if(recentInfo.recentlyTreated) recentClass = 'recent-med';
      }
      // If the most recently logged entry (by actual entry time) is a note,
      // flag the card blue regardless of the medicine-based status above.
      const latest = latestRecordFor(num);
      if(latest && !latest.medicine){
        recentClass = 'recent-note';
      }
      const card = document.createElement('div');
      card.className = 'cow-card ' + recentClass;
      const lotBadge = cow.lot ? `<span class="lot-badge">${escapeHtml(cow.lot)}</span>` : '';
      card.innerHTML = `<div><div class="cow-num">#${escapeHtml(num)}${lotBadge}</div><div class="cow-meta">${meta}</div></div><div class="chev">&rsaquo;</div>`;
      card.addEventListener('click', ()=> openCow(num));
      cowListEl.appendChild(card);
    });
  }

  function showHome(){
    currentCow = null;
    searchBox.value = '';
    homeView.classList.remove('hidden');
    listView.classList.add('hidden');
    detailView.classList.add('hidden');
    fabAdd.classList.add('hidden');
    window.scrollTo(0,0);
  }
  function showMedsNotes(){
    homeView.classList.add('hidden');
    detailView.classList.add('hidden');
    listView.classList.remove('hidden');
    fabAdd.classList.remove('hidden');
    renderList();
    window.scrollTo(0,0);
  }

  function openCow(num){
    currentCow = num;
    searchBox.blur();
    document.getElementById('detailNum').textContent = '#'+num;
    listView.classList.add('hidden');
    detailView.classList.remove('hidden');
    fabAdd.classList.add('hidden');
    renderDetail();
    updateLotLabel();
    window.scrollTo(0,0);
  }
  function updateLotLabel(){
    const cow = cows.find(c=>c.number===currentCow);
    const el = document.getElementById('detailLot');
    el.textContent = (cow && cow.lot) ? `Lot: ${cow.lot} (tap to edit)` : 'Set lot/pasture';
  }
  function closeCow(){
    currentCow = null;
    detailView.classList.add('hidden');
    listView.classList.remove('hidden');
    fabAdd.classList.remove('hidden');
    searchBox.value = '';
    renderList();
    window.scrollTo(0,0);
  }

  function renderDetail(){
    const records = [...recordsFor(currentCow)].sort((a,b)=> b.date.localeCompare(a.date));
    const meds = records.filter(r=>r.medicine).length;
    const notes = records.length - meds;
    const parts = [];
    if(meds>0) parts.push(`${meds} treatment${meds>1?'s':''}`);
    if(notes>0) parts.push(`${notes} note${notes>1?'s':''}`);
    document.getElementById('detailSub').textContent = parts.length ? parts.join(' · ') + ' logged' : '0 entries logged';
    const listEl = document.getElementById('recordList');
    const noRecords = document.getElementById('noRecords');
    listEl.innerHTML = '';
    noRecords.classList.toggle('hidden', records.length !== 0);

    records.forEach(r=>{
      const div = document.createElement('div');
      const isNote = !r.medicine;
      div.className = 'record' + (isNote ? ' note-entry' : '');
      div.innerHTML = `
        <button class="record-del" data-id="${r.id}">&times;</button>
        <button class="record-edit" data-id="${r.id}">&#9998;</button>
        <div class="record-date">${fmtDate(r.date)}${isNote ? ' · NOTE' : ''}</div>
        ${isNote ? '' : `<div class="record-med">${escapeHtml(r.medicine)}</div><div class="record-reason">${escapeHtml(r.reason)}</div>`}
        ${r.notes ? `<div class="${isNote ? 'record-reason' : 'record-notes'}">${escapeHtml(r.notes)}</div>` : ''}
      `;
      div.querySelector('.record-del').addEventListener('click', (e)=>{
        e.stopPropagation();
        deleteRecord(r.id);
      });
      div.querySelector('.record-edit').addEventListener('click', (e)=>{
        e.stopPropagation();
        editRecordModal(r);
      });
      listEl.appendChild(div);
    });
  }

  async function deleteRecord(id){
    try{
      await api('/treatments?id=eq.' + encodeURIComponent(id), { method:'DELETE' });
      treatments = treatments.filter(t=>t.id!==id);
      renderDetail();
      renderList();
      showToast('Treatment removed');
    }catch(e){ showToast('Could not remove — try again'); }
  }

  async function deleteCow(){
    if(!currentCow) return;
    if(!confirm(`Remove cow #${currentCow} and all its treatment history? This can't be undone.`)) return;
    try{
      await api('/cows?number=eq.' + encodeURIComponent(currentCow), { method:'DELETE' });
      cows = cows.filter(c=>c.number!==currentCow);
      treatments = treatments.filter(t=>t.cow_number!==currentCow);
      closeCow();
      showToast('Cow removed');
    }catch(e){ showToast('Could not remove — try again'); }
  }

  // ---- Modals ----
  function openModal(html){
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.id = 'activeModal';
    backdrop.innerHTML = `<div class="modal">${html}</div>`;
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });
    document.body.appendChild(backdrop);
    return backdrop;
  }
  function closeModal(){
    const m = document.getElementById('activeModal');
    if(m) m.remove();
  }

  function addCowModal(){
    const modal = openModal(`
      <div class="modal-title">Add Cow</div>
      <div id="singleAddFields">
        <div class="field">
          <label>Cow / Ear Tag Number</label>
          <input type="text" id="newCowNum" inputmode="numeric" placeholder="e.g. 214" autofocus/>
        </div>
      </div>
      <div id="bulkAddFields" class="hidden">
        <div class="field">
          <label>Cow / Ear Tag Numbers</label>
          <textarea id="newCowBulkNums" rows="4" placeholder="e.g. 214, 215, 216 or one per line"></textarea>
        </div>
      </div>
      <a href="#" id="toggleBulkMode" style="display:block;font-family:'Courier New',monospace;font-size:12px;color:var(--barn);text-decoration:underline;margin-bottom:14px;">Add multiple cows at once</a>
      ${fieldWithOther('newCowLot', 'Lot / Pasture / Group (optional)', LOT_OPTIONS, 'Type lot/pasture')}
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelAddCow">Cancel</button>
        <button class="btn btn-barn" id="confirmAddCow">Add Cow</button>
      </div>
    `);
    wireFieldWithOther(modal, 'newCowLot');
    modal.querySelector('#cancelAddCow').addEventListener('click', closeModal);

    let bulkMode = false;
    const singleFields = modal.querySelector('#singleAddFields');
    const bulkFields = modal.querySelector('#bulkAddFields');
    const toggleLink = modal.querySelector('#toggleBulkMode');
    const confirmBtn = modal.querySelector('#confirmAddCow');
    toggleLink.addEventListener('click', (e)=>{
      e.preventDefault();
      bulkMode = !bulkMode;
      singleFields.classList.toggle('hidden', bulkMode);
      bulkFields.classList.toggle('hidden', !bulkMode);
      toggleLink.textContent = bulkMode ? 'Switch back to adding one cow' : 'Add multiple cows at once';
      confirmBtn.textContent = bulkMode ? 'Add Cows' : 'Add Cow';
    });

    confirmBtn.addEventListener('click', async ()=>{
      const lot = valueOf(modal, 'newCowLot');
      confirmBtn.disabled = true;

      if(!bulkMode){
        const num = modal.querySelector('#newCowNum').value.trim();
        if(!num){ showToast('Enter a cow number'); confirmBtn.disabled = false; return; }
        if(cows.some(c=>c.number===num)){ showToast('That cow already exists'); confirmBtn.disabled = false; return; }
        try{
          const inserted = await api('/cows', {
            method:'POST',
            headers: Object.assign({}, HEADERS, {'Prefer':'return=representation'}),
            body: JSON.stringify({ number: num, lot: lot||null })
          });
          cows.push(inserted[0]);
          closeModal();
          renderList();
          showToast(`Cow #${num} added`);
          openCow(num);
        }catch(e){
          confirmBtn.disabled = false;
          showToast('Could not add cow — try again');
        }
        return;
      }

      // Bulk mode: split on commas, newlines, or spaces; dedupe against existing cows.
      const raw = modal.querySelector('#newCowBulkNums').value;
      const entered = [...new Set(raw.split(/[,\n\s]+/).map(s=>s.trim()).filter(Boolean))];
      if(entered.length === 0){ showToast('Enter at least one cow number'); confirmBtn.disabled = false; return; }
      const existingNums = new Set(cows.map(c=>c.number));
      const toAdd = entered.filter(n=>!existingNums.has(n));
      const skipped = entered.length - toAdd.length;
      if(toAdd.length === 0){ showToast('All of those cows already exist'); confirmBtn.disabled = false; return; }

      try{
        const inserted = await api('/cows', {
          method:'POST',
          headers: Object.assign({}, HEADERS, {'Prefer':'return=representation'}),
          body: JSON.stringify(toAdd.map(num=>({ number: num, lot: lot||null })))
        });
        cows.push(...inserted);
        closeModal();
        renderList();
        showToast(`${inserted.length} cow${inserted.length>1?'s':''} added` + (skipped>0 ? ` (${skipped} already existed)` : ''));
      }catch(e){
        confirmBtn.disabled = false;
        showToast('Could not add cows — try again');
      }
    });
  }

  function fieldWithOther(id, label, options, placeholder){
    const opts = options.map(o=>`<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
    return `
      <div class="field">
        <label>${label}</label>
        <select id="${id}Select">
          <option value="">-- Select --</option>
          ${opts}
          <option value="__other__">Other (type it in)</option>
        </select>
        <input type="text" id="${id}Other" placeholder="${placeholder}" style="margin-top:8px;display:none;"/>
      </div>
    `;
  }

  const MEDICINE_OPTIONS = ['LA-200','Draxxin','Baytril','Banamine','Penicillin','Vitamin B12'];
  const REASON_OPTIONS = ['Respiratory / pneumonia','Foot rot','Pinkeye','Scours / diarrhea','Bloat','Mastitis','Injury / wound'];

  function wireFieldWithOther(modal, id){
    const select = modal.querySelector('#'+id+'Select');
    const other = modal.querySelector('#'+id+'Other');
    select.addEventListener('change', ()=>{
      if(select.value === '__other__'){
        other.style.display = 'block';
        other.focus();
      } else {
        other.style.display = 'none';
        other.value = '';
      }
    });
  }
  function valueOf(modal, id){
    const select = modal.querySelector('#'+id+'Select');
    const other = modal.querySelector('#'+id+'Other');
    if(select.value === '__other__') return other.value.trim();
    return select.value;
  }
  function prefillFieldWithOther(modal, id, value, options){
    const select = modal.querySelector('#'+id+'Select');
    const other = modal.querySelector('#'+id+'Other');
    if(!value) return;
    if(options.includes(value)){
      select.value = value;
    } else {
      select.value = '__other__';
      other.style.display = 'block';
      other.value = value;
    }
  }

  function recordModal(existingRecord){
    const isEdit = !!existingRecord;
    const today = new Date().toISOString().slice(0,10);
    const modal = openModal(`
      <div class="modal-title">${isEdit ? 'Edit Entry' : 'Log Entry'} — #${escapeHtml(currentCow)}</div>
      <div class="row2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="recDate" value="${isEdit ? existingRecord.date : today}"/>
        </div>
      </div>
      ${fieldWithOther('recMed', 'Medicine (optional)', MEDICINE_OPTIONS, 'Type medicine name')}
      ${fieldWithOther('recReason', 'Reason (optional)', REASON_OPTIONS, 'Type reason')}
      <div class="field">
        <label>Notes</label>
        <textarea id="recNotes" rows="2" placeholder="Dosage, observations, or just a general note">${isEdit ? escapeHtml(existingRecord.notes||'') : ''}</textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelAddRec">Cancel</button>
        <button class="btn btn-barn" id="confirmAddRec">${isEdit ? 'Save Changes' : 'Save Entry'}</button>
      </div>
    `);
    wireFieldWithOther(modal, 'recMed');
    wireFieldWithOther(modal, 'recReason');
    if(isEdit){
      prefillFieldWithOther(modal, 'recMed', existingRecord.medicine, MEDICINE_OPTIONS);
      prefillFieldWithOther(modal, 'recReason', existingRecord.reason, REASON_OPTIONS);
    }
    modal.querySelector('#cancelAddRec').addEventListener('click', closeModal);
    modal.querySelector('#confirmAddRec').addEventListener('click', async ()=>{
      const dateVal = modal.querySelector('#recDate').value;
      const med = valueOf(modal, 'recMed');
      const reason = valueOf(modal, 'recReason');
      const notes = modal.querySelector('#recNotes').value.trim();
      if(!dateVal){ showToast('Date is required'); return; }
      if(!med && !reason && !notes){ showToast('Enter at least a medicine/reason or a note'); return; }
      const btn = modal.querySelector('#confirmAddRec');
      btn.disabled = true;
      const body = { date: dateVal, medicine: med||null, reason: reason||null, notes: notes||null };
      try{
        if(isEdit){
          const updated = await api('/treatments?id=eq.' + encodeURIComponent(existingRecord.id), {
            method:'PATCH',
            headers: Object.assign({}, HEADERS, {'Prefer':'return=representation'}),
            body: JSON.stringify(body)
          });
          const idx = treatments.findIndex(t=>t.id===existingRecord.id);
          if(idx !== -1) treatments[idx] = updated[0];
        } else {
          const inserted = await api('/treatments', {
            method:'POST',
            headers: Object.assign({}, HEADERS, {'Prefer':'return=representation'}),
            body: JSON.stringify(Object.assign({ cow_number: currentCow }, body))
          });
          treatments.push(inserted[0]);
        }
        closeModal();
        renderDetail();
        renderList();
        window.scrollTo(0,0);
        showToast(isEdit ? 'Entry updated' : 'Entry logged');
      }catch(e){
        btn.disabled = false;
        showToast('Could not save — try again');
      }
    });
  }
  function addRecordModal(){ recordModal(null); }
  function editRecordModal(record){ recordModal(record); }

  document.getElementById('fabAdd').addEventListener('click', addCowModal);
  document.getElementById('homeMedsBtn').addEventListener('click', showMedsNotes);
  document.getElementById('listHomeBtn').addEventListener('click', showHome);
  document.getElementById('detailHomeBtn').addEventListener('click', showHome);
  document.getElementById('backBtn').addEventListener('click', closeCow);
  document.getElementById('addRecordBtn').addEventListener('click', addRecordModal);
  document.getElementById('deleteCowBtn').addEventListener('click', deleteCow);
  document.getElementById('detailLot').addEventListener('click', editLotModal);

  const LOT_OPTIONS = ['Home',"Olin's",'Ballard Corner',"Chase's",'Ford City',"Laughlin's"];

  function editLotModal(){
    const cow = cows.find(c=>c.number===currentCow);
    const modal = openModal(`
      <div class="modal-title">Lot / Pasture — #${escapeHtml(currentCow)}</div>
      ${fieldWithOther('editLot', 'Lot / Pasture / Group', LOT_OPTIONS, 'Type lot/pasture')}
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelEditLot">Cancel</button>
        <button class="btn btn-barn" id="confirmEditLot">Save</button>
      </div>
    `);
    wireFieldWithOther(modal, 'editLot');
    if(cow && cow.lot) prefillFieldWithOther(modal, 'editLot', cow.lot, LOT_OPTIONS);
    modal.querySelector('#cancelEditLot').addEventListener('click', closeModal);
    modal.querySelector('#confirmEditLot').addEventListener('click', async ()=>{
      const lot = valueOf(modal, 'editLot');
      const btn = modal.querySelector('#confirmEditLot');
      btn.disabled = true;
      try{
        const updated = await api('/cows?number=eq.' + encodeURIComponent(currentCow), {
          method:'PATCH',
          headers: Object.assign({}, HEADERS, {'Prefer':'return=representation'}),
          body: JSON.stringify({ lot: lot||null })
        });
        const idx = cows.findIndex(c=>c.number===currentCow);
        if(idx !== -1) cows[idx] = updated[0];
        closeModal();
        updateLotLabel();
        renderList();
        showToast('Lot updated');
      }catch(e){
        btn.disabled = false;
        showToast('Could not save — try again');
      }
    });
  }
  document.getElementById('exportBtn').addEventListener('click', exportCsv);
  document.getElementById('lotFilter').addEventListener('change', renderList);
  document.getElementById('sortBy').addEventListener('change', renderList);
  searchBox.addEventListener('input', renderList);
  document.getElementById('backupExportBtn').addEventListener('click', exportCsv);
  document.getElementById('backupDismissBtn').addEventListener('click', ()=>{
    localStorage.setItem('backupDismissedAt', Date.now().toString());
    document.getElementById('backupBanner').classList.add('hidden');
  });

  function csvEscape(val){
    const s = (val===null || val===undefined) ? '' : String(val);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  async function exportCsv(){
    // Refresh first so the export reflects the latest data, not a stale in-memory copy.
    await loadAll();
    const rows = [['Cow Number','Lot/Group','Date Given','Medicine','Reason','Notes','Cow Added']];
    const cowMap = {};
    cows.forEach(c=> cowMap[c.number] = c);

    const sortedTreatments = [...treatments].sort((a,b)=>{
      const numCmp = a.cow_number.localeCompare(b.cow_number, undefined, {numeric:true});
      if(numCmp !== 0) return numCmp;
      return a.date.localeCompare(b.date);
    });

    sortedTreatments.forEach(t=>{
      const c = cowMap[t.cow_number] || {};
      rows.push([t.cow_number, c.lot||'', t.date, t.medicine || '(note only)', t.reason || '', t.notes||'', c.added_at||'']);
    });

    // Include cows with zero treatments too, so nothing gets left out of the export.
    const treatedCows = new Set(treatments.map(t=>t.cow_number));
    cows.filter(c=>!treatedCows.has(c.number))
        .sort((a,b)=>a.number.localeCompare(b.number, undefined, {numeric:true}))
        .forEach(c=>{
          rows.push([c.number, c.lot||'', '', '', '', '', c.added_at]);
        });

    const csv = rows.map(r=> r.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'herd-med-log-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    localStorage.setItem('lastExportAt', Date.now().toString());
    document.getElementById('backupBanner').classList.add('hidden');
    showToast('Spreadsheet downloaded');
  }

  function checkBackupReminder(){
    const DAY = 86400000;
    const lastExport = parseInt(localStorage.getItem('lastExportAt')||'0', 10);
    const dismissed = parseInt(localStorage.getItem('backupDismissedAt')||'0', 10);
    const daysSinceExport = (Date.now() - lastExport) / DAY;
    const daysSinceDismiss = (Date.now() - dismissed) / DAY;
    if(cows.length > 0 && daysSinceExport > 30 && daysSinceDismiss > 7){
      const label = lastExport ? `${Math.floor(daysSinceExport)} days` : "You haven't yet";
      document.getElementById('backupBannerText').textContent =
        lastExport ? `It's been ${label} since your last spreadsheet backup.` : "You haven't exported a spreadsheet backup yet.";
      document.getElementById('backupBanner').classList.remove('hidden');
    } else {
      document.getElementById('backupBanner').classList.add('hidden');
    }
  }

  loadAll();

  // Refresh whenever the app comes back into view (e.g. switching back
  // to it from the home screen or another tab) instead of only on first load.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      loadAll();
      if(currentCow) renderDetail();
    }
  });
  window.addEventListener('focus', loadAll);
  window.addEventListener('pageshow', loadAll);

  // Tap the refresh button to force a manual reload any time.
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.addEventListener('click', async ()=>{
    await loadAll();
    if(currentCow) renderDetail();
    showToast('Refreshed');
  });
})();
</script>

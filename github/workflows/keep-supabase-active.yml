name: Keep Supabase Active
 
on:
  schedule:
    # Runs at 13:00 UTC every Monday and Thursday — never more than 4 days apart,
    # well under Supabase's 7-day inactivity pause threshold.
    - cron: '0 13 * * 1,4'
  workflow_dispatch: {}
 
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://nuutfigyhjyqhtxotuln.supabase.co/rest/v1/cows?select=number&limit=1" \
            -H "apikey: sb_publishable_jvBVaIs5ZYmOUuE8o28mqQ_RMipD5Xw" \
            -H "Authorization: Bearer sb_publishable_jvBVaIs5ZYmOUuE8o28mqQ_RMipD5Xw"
